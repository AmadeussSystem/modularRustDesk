events {
    worker_connections 1024;
}

http {
    # Properly map WebSocket upgrade headers
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Define a custom log format to capture the User-Agent and Accept-Language headers
    log_format custom_headers '$remote_addr - $remote_user [$time_local] "$request" '
                              '$status $body_bytes_sent "$http_referer" '
                              '"$http_user_agent" "$http_accept_language"';

    server {
        # Listen on port 443 with SSL enabled
        listen 443 ssl;
        
        # Accept connections regardless of the SNI provided by the client
        # The underscore acts as a catch-all server name.
        server_name _; 

        # Paths to the self-signed certificate and private key generated by the script
        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        # Standard secure TLS protocols
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Enable logging with the custom format
        access_log /var/log/nginx/access.log custom_headers;

        # Proxy /ws/id to the hbbs Rendezvous Server (default port 21118 for WS)
        location /ws/id {
            proxy_pass http://127.0.0.1:21118;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # Forward real client IPs to the backend
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Keep connections alive for long desktop sessions
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # Proxy /ws/relay to the hbbr Relay Server (default port 21119 for WS)
        location /ws/relay {
            proxy_pass http://127.0.0.1:21119;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # Forward real client IPs to the backend
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Keep connections alive for long desktop sessions
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }
    }
}
